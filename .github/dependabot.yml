version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]

  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: weekly
    labels: [dependencies, ai-service]

  - package-ecosystem: npm
    directory: /backend-ai-tutor/backend
    schedule:
      interval: weekly
    labels: [dependencies, node-gateway]

  - package-ecosystem: npm
    directory: /admin-ai-tutor
    schedule:
      interval: weekly
    labels: [dependencies, admin]

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_tutor
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub -r compact

  node-gateway:
    name: Node gateway build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-ai-tutor/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-ai-tutor/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --runInBand

  ai-service:
    name: AI service tests and curriculum release gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    env:
      PYTHONPATH: .
      ENVIRONMENT: test
      APP_ENV: test
      ALLOW_DEVELOPMENT_FALLBACKS: "false"
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: reanai_ci
      REDIS_URL: redis://localhost:6379/1
      VISUAL_TUTOR_INTERNAL_TOKEN: ci-only-not-a-secret-token-000000000
      OPENROUTER_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/constraints-ai.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-ai.txt -r requirements.txt
      - name: Run Python test suite
        run: python -m pytest -q
      - name: Enforce curriculum release gate
        run: |
          python scripts/audit_visual_tutor_curriculum.py
          python -m pytest -q \
            tests/test_curriculum_production_pipeline.py \
            tests/test_published_curriculum_pipeline.py \
            tests/test_visual_tutor_release_benchmark.py
      - name: Upload curriculum coverage manifest
        uses: actions/upload-artifact@v7
        with:
          name: curriculum-release-coverage
          path: ai-service/data/curriculum_release_coverage.json

  admin:
    name: Admin build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ai-tutor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ai-tutor/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

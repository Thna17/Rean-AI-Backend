name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-flutter-web:
    name: Build and deploy Flutter web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: ai_tutor
        run: flutter pub get
      - name: Build release web bundle
        working-directory: ai_tutor
        env:
          APP_ENV: production
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          AI_SERVICE_BASE_URL: ${{ vars.AI_SERVICE_BASE_URL }}
        run: |
          : "${BACKEND_BASE_URL:?Set BACKEND_BASE_URL as a repository variable}"
          : "${AI_SERVICE_BASE_URL:?Set AI_SERVICE_BASE_URL as a repository variable}"
          flutter build web --release --no-pub \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=BACKEND_BASE_URL="$BACKEND_BASE_URL" \
            --dart-define=AI_SERVICE_BASE_URL="$AI_SERVICE_BASE_URL"
      - name: Deploy static web bundle to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FLUTTER }}
        run: |
          : "${VERCEL_TOKEN:?Set VERCEL_TOKEN in GitHub Secrets}"
          : "${VERCEL_ORG_ID:?Set VERCEL_ORG_ID in GitHub Secrets}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID_FLUTTER in GitHub Secrets}"
          npx --yes vercel@39.1.1 link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID"
          npx --yes vercel@39.1.1 deploy "$GITHUB_WORKSPACE/ai_tutor/build/web" \
            --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

  publish-container-images:
    name: Build and publish service images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: node-gateway
            context: backend-ai-tutor/backend
            dockerfile: backend-ai-tutor/backend/Dockerfile
          - image: ai-service
            context: ai-service
            dockerfile: ai-service/Dockerfile.prod
          - image: admin
            context: admin-ai-tutor
            dockerfile: admin-ai-tutor/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

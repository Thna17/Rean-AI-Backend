# Local development dependencies and service containers for the current ReanAI
# layout. Browser clients run from `ai_tutor`; the admin app is optional.
#
# Required before `docker compose ... up`:
#   export VISUAL_TUTOR_INTERNAL_TOKEN="$(openssl rand -hex 32)"
#
# This file is development-only. It deliberately does not contain production
# credentials or enable production deployment settings.
services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - reanai_mongodb_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - reanai_redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      ENVIRONMENT: development
      APP_ENV: development
      ALLOW_DEVELOPMENT_FALLBACKS: "false"
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: ai_tutor_dev
      REDIS_URL: redis://redis:6379/1
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:53123,http://localhost:53124}
      VISUAL_TUTOR_INTERNAL_TOKEN: ${VISUAL_TUTOR_INTERNAL_TOKEN:?Set a 32+ character local token}
      VISUAL_TUTOR_LLM_PROVIDER: ${VISUAL_TUTOR_LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  node-gateway:
    build:
      context: ./backend-ai-tutor/backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: 4000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:53123,http://localhost:53124}
      AI_SERVICE_BASE_URL: http://ai-service:8001
      VISUAL_TUTOR_INTERNAL_TOKEN: ${VISUAL_TUTOR_INTERNAL_TOKEN:?Set a 32+ character local token}
      ALLOW_DEVELOPMENT_FALLBACKS: ${ALLOW_DEVELOPMENT_FALLBACKS:-false}
      AI_SERVICE_USE_DEV_MOCK: ${AI_SERVICE_USE_DEV_MOCK:-false}
    depends_on:
      ai-service:
        condition: service_healthy

  admin:
    profiles: [admin]
    build:
      context: ./admin-ai-tutor
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development

volumes:
  reanai_mongodb_dev:
  reanai_redis_dev:

services:
  # ============================================
  # PostgreSQL Database (Backend Service)
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: ai_tutor-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_tutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_tutor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_tutor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_tutor-network

  # ============================================
  # pgAdmin (PostgreSQL Web Management UI)
  # ============================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: ai_tutor-pgadmin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ai_tutor.me}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "'AI Tutor Database Management'"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai_tutor-network

  # ============================================
  # MongoDB Database (AI Service)
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: ai_tutor-mongodb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ai_tutor
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./ai-service/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - ai_tutor-network

  # ============================================
  # Mongo Express (MongoDB Web Management UI)
  # ============================================
  mongo-express:
    image: mongo-express:latest
    container_name: ai_tutor-mongo-express
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?Set MONGO_EXPRESS_PASSWORD in .env}
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ai_tutor-network

  # ============================================
  # Redis Cache (Backend)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ai_tutor-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m
    memswap_limit: 256m
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_tutor-network

  # ============================================
  # Redis Cache (AI Dedicated)
  # ============================================
  redis-ai:
    image: redis:7-alpine
    container_name: ai_tutor-redis-ai
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    mem_limit: 768m
    memswap_limit: 768m
    command: redis-server --appendonly yes --maxmemory 600mb --maxmemory-policy allkeys-lfu
    volumes:
      - redis_ai_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_tutor-network

  # ============================================
  # RedisInsight (Redis Web Management UI)
  # ============================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: ai_tutor-redisinsight
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "8282:5540"
    depends_on:
      redis:
        condition: service_healthy
      redis-ai:
        condition: service_healthy
    networks:
      - ai_tutor-network

  # ============================================
  # Ollama (Local LLM for AI Service)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: ai_tutor-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_tutor-network

  # ============================================
  # Backend Service (FastAPI + PostgreSQL)
  # ============================================
  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: ai_tutor-backend-service
    restart: unless-stopped
    env_file:
      - ./backend-service/.env
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_tutor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_tutor}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-False}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
      AI_SERVICE_URL: http://ai-service:8001/api/v1
      # Redis (use container hostname, not localhost)
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Firebase
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-ai_tutor-88492}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ADMIN_CLIENT_ID: ${GOOGLE_ADMIN_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-service/app:/app/app
      - ./backend-service/alembic:/app/alembic
      - ./backend-service/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips="*"
    networks:
      - ai_tutor-network

  backend-reminder-worker:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: ai_tutor-reminder-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app worker --loglevel=INFO --concurrency=1
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_tutor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_tutor}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-False}
      REDIS_URL: redis://redis:6379/0
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-false}
      REMINDER_DRY_RUN: ${REMINDER_DRY_RUN:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-ai_tutor-88492}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-service/app:/app/app
      - ./backend-service/alembic:/app/alembic
    networks:
      - ai_tutor-network

  backend-reminder-beat:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: ai_tutor-reminder-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app beat --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_tutor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_tutor}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-False}
      REDIS_URL: redis://redis:6379/0
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-false}
      REMINDER_DRY_RUN: ${REMINDER_DRY_RUN:-true}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend-service/app:/app/app
    networks:
      - ai_tutor-network

  # ============================================
  # AI Service (FastAPI + MongoDB)
  # ============================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai_tutor-ai-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    mem_limit: 6g
    memswap_limit: 6g
    ports:
      - "8001:8001"
    environment:
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      AI_JWT_ISSUER: ${JWT_ISSUER:-lexilingo-backend}
      AI_JWT_AUDIENCE: ${JWT_AUDIENCE:-lexilingo-services}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: ai_tutor
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_TIMEOUT: "180"
      TRACECAG_PREFER_CLOUD_LLM: "false"
      STT_ENABLED: "false"
      STT_VERIFY_ENABLED: "false"
      REDIS_HOST: redis-ai
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_URL: redis://redis-ai:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env}
      DEBUG: ${DEBUG:-false}
    depends_on:
      mongodb:
        condition: service_healthy
      redis-ai:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./ai-service/api:/app/api
      - ./ai-service/data:/app/data
      - ./ai-service/models:/app/models
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - ai_tutor-network

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  redis_ai_data:
    driver: local
  ollama_data:
    driver: local

networks:
  ai_tutor-network:
    driver: bridge

# Production deployment topology for the current repository layout.
#
# Supply all values from a deployment secret manager via:
#   docker compose --env-file .env.production --env-file .env.production.secrets up -d
#
# TLS termination, public ingress, backups, and secret storage belong to the
# deployment platform. This Compose file intentionally contains no credentials.
services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?Set in secret manager}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?Set in secret manager}
    volumes:
      - reanai_mongodb_prod:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok' | grep 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: /bin/sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set in secret manager}
    volumes:
      - reanai_redis_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  ai-service:
    image: ${AI_SERVICE_IMAGE:-ghcr.io/your-org/reanai/ai-service:latest}
    build:
      context: ./ai-service
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.production.secrets
    environment:
      ENVIRONMENT: production
      APP_ENV: production
      DEBUG: "false"
      ALLOW_DEVELOPMENT_FALLBACKS: "false"
      MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME:?Set in secret manager}:${MONGODB_ROOT_PASSWORD:?Set in secret manager}@mongodb:27017/?authSource=admin
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ai_tutor}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set in secret manager}@redis:6379/1
      VISUAL_TUTOR_INTERNAL_TOKEN: ${VISUAL_TUTOR_INTERNAL_TOKEN:?Set in secret manager}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set public browser origins in secret manager}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  node-gateway:
    image: ${NODE_GATEWAY_IMAGE:-ghcr.io/your-org/reanai/node-gateway:latest}
    build:
      context: ./backend-ai-tutor/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
      - .env.production.secrets
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 4000
      AI_SERVICE_BASE_URL: http://ai-service:8001
      VISUAL_TUTOR_INTERNAL_TOKEN: ${VISUAL_TUTOR_INTERNAL_TOKEN:?Set in secret manager}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set public browser origins in secret manager}
    depends_on:
      ai-service:
        condition: service_healthy
    ports:
      - "${NODE_GATEWAY_PORT:-4000}:4000"

  admin:
    profiles: [admin]
    image: ${ADMIN_IMAGE:-ghcr.io/your-org/reanai/admin:latest}
    build:
      context: ./admin-ai-tutor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${ADMIN_PORT:-3000}:3000"

volumes:
  reanai_mongodb_prod:
  reanai_redis_prod:
